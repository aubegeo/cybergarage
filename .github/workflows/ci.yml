name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Angular 22 exige ^22.22.3 || ^24.15.0 || >=26.0.0. Ce workflow etait
          # reste sur Node 20 apres la montee 21 -> 22, et echouait donc avec
          # « The Angular CLI requires a minimum Node.js version » (code 3).
          # deploy-pages.yml etait deja sur 22, seul le CI avait ete oublie.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (development)
        run: npx ng build --configuration development

      - name: Run tests
        run: npx ng test --watch=false
